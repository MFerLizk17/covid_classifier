[project]
name = "covid-classifier"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fernanda Lizcano", email = "maria.lizcanou@gmail.com" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "pillow>=10.0.0",
    "matplotlib>=3.8.0",
    "numpy>=1.26.0",
    "tqdm>=4.66.0",
    "scikit-learn>=1.3.0",
    "opencv-python>=4.13.0.92",
    "pandas>=2.3.3",
    "scikit-image>=0.26.0",
    "kagglehub>=1.0.0",
    "torch>=2.5.1",
    "torchvision>=0.20.1",
    "torchaudio>=2.5.1",
]

[project.scripts]
covid-classifier = "covid_classifier:main"

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
